name: hackernews-mcp
description: Get current top stories from Hacker News. No API key required.
author: https://github.com/zxk0311/hackernews-mcp
license: MIT
tags:
  - hackernews
  - mcp
  - news

params:
  type: object
  properties: {}

local: |
  python server.py

config: |
  {
    "mcpServers": {
      "hackernews": {
        "command": "python",
        "args": ["server.py"]
      }
    }
  }
